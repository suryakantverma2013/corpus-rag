# Corpus edge (T-605) — the reverse proxy that makes the product single-origin.
#
# This is not a convenience. The backend ships NO CORS middleware by design, and the
# refresh-token cookie is SameSite=strict — both of which are only coherent if the SPA and
# the API answer on one origin. `frontend/vite.config.ts` reproduces this arrangement in
# development with its /api and /health proxy; this file is the production half.
#
# Base image is nginx-unprivileged, which runs as uid 101 and therefore cannot bind 80.

server {
    listen      8080;
    server_name _;

    # FR-ERR-01 fixes the per-file ceiling at 50 MB (UPLOAD_MAX_FILE_BYTES = 52428800).
    # nginx must sit ABOVE it with room for multipart framing: at or below it nginx answers
    # its own terse 413 before the request reaches the API, and the user never sees the
    # FR-ERR-01 copy the product wrote for exactly this case.
    client_max_body_size 320m;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API + probes ----------------------------------------------------------
    # No rewrite: the routes are already /api/v1/... and /health*, so the prefix is passed
    # through untouched. `proxy_pass http://api:8000;` without a trailing path preserves
    # the original URI.
    location /api/ {
        include     /etc/nginx/conf.d/proxy.inc;
        include     /etc/nginx/conf.d/streaming.inc;
        proxy_pass  http://api:8000;
    }

    # Not streaming, so it keeps buffering and the default timeouts.
    location /health {
        include     /etc/nginx/conf.d/proxy.inc;
        proxy_pass  http://api:8000;
    }

    # ---- Keycloak, at the same origin ------------------------------------------
    # Keycloak runs with KC_HTTP_RELATIVE_PATH=/auth, so again no rewrite is needed.
    # Serving it here is what makes the "mode B" public-origin deployment possible without
    # any structural change: the browser and the API then resolve one issuer URL. See
    # docs/DEPLOYMENT.md, "The issuer constraint".
    location /auth/ {
        include     /etc/nginx/conf.d/proxy.inc;
        proxy_pass  http://keycloak:8080;
        # Keycloak has no streaming endpoints, so streaming.inc is deliberately not
        # included here and nginx's default buffering applies.
    }

    # ---- SPA -------------------------------------------------------------------
    # Vite emits content-hashed filenames into /assets, so they are immutable forever.
    location /assets/ {
        try_files $uri =404;
        expires    1y;
        add_header Cache-Control "public, immutable";
        include    /etc/nginx/conf.d/security.inc;
    }

    # The entry document must never be cached, or a deploy is invisible until the browser
    # decides otherwise.
    location = /index.html {
        add_header Cache-Control "no-store";
        # The entry document, so this is the one that matters: `try_files $uri /index.html`
        # below performs an internal redirect, which re-enters location matching here.
        include    /etc/nginx/conf.d/security.inc;
    }

    # History fallback. Deliberately `$uri /index.html` and not `$uri $uri/ /index.html`:
    # the SPA has no directory indexes, and the `$uri/` term invites a redirect loop on /.
    location / {
        try_files $uri /index.html;
        include    /etc/nginx/conf.d/security.inc;
    }

    # Deliberately NOT proxied: /docs, /redoc, /openapi.json. FastAPI still serves them
    # inside the network, but nothing routes to them from outside — so the interactive API
    # docs are off in production without a line of application code changing. Add a
    # location block (ideally behind auth) if you decide you want them.
}
