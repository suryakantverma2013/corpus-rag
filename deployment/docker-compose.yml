# Corpus dev infrastructure (T-005).
#
# Default service: Redis (arq broker) only. The developer reuses existing local
# services for the rest — a local pgvector-enabled Postgres (dedicated `corpus`
# database) and a MinIO already on :9000/:9001. Both are available here behind
# profiles for anyone who lacks a local one:
#   docker compose --profile minio    up -d   # + MinIO object storage
#   docker compose --profile postgres up -d   # + pgvector Postgres
#   docker compose --profile clamav   up -d   # + ClamAV malware scanner (T-207, R-32)
#
# Usage (from repo root):
#   docker compose -f deployment/docker-compose.yml up -d                    # redis only
#   docker compose -f deployment/docker-compose.yml --profile minio up -d    # redis + minio
#   docker compose -f deployment/docker-compose.yml --profile clamav up -d   # redis + clamav
#   docker compose -f deployment/docker-compose.yml down
#
# Credentials here are DEV DEFAULTS and match backend/.env(.example). Override via
# the environment for anything shared.

services:
  # Optional: only for developers without an existing MinIO. Enable with
  # `--profile minio`.
  #
  # Ports are env-driven because the service this profile replaces is usually already
  # holding 9000/9001 — a foreign MinIO on the default ports is the exact situation that
  # makes someone enable this profile, and a hardcoded mapping then refuses to start.
  # Set MINIO_API_PORT/MINIO_CONSOLE_PORT (and MINIO_ENDPOINT in backend/.env to match)
  # to run alongside it; the defaults are unchanged for anyone with the ports free.
  minio:
    image: minio/minio
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: only for developers without a local pgvector instance.
  # Enable with `--profile postgres`. Schema + indexes are owned by Alembic (T-101);
  # this just creates the `corpus` database and enables the `vector` extension.
  postgres:
    image: pgvector/pgvector:pg18
    profiles: ["postgres"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-corpus}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb/01-extension.sql:/docker-entrypoint-initdb.d/01-extension.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-corpus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Malware screening for the ingestion worker (T-207, ruling R-32 / spec §8.13).
  # Profile-gated like the other heavyweights: it wants ~2 GB of RAM for the signature
  # database, so a developer working on the API alone should not have to run it. With the
  # profile off, set SCANNER_BACKEND=structural — the in-process structural screens still
  # run (R-38(7)); there is no setting that disables screening entirely.
  #
  # First start is slow: freshclam downloads ~1 GB of signatures before clamd accepts
  # connections, hence the long start_period. The named volume keeps that download from
  # repeating on every restart.
  clamav:
    image: clamav/clamav:latest
    profiles: ["clamav"]
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
      # StreamMaxLength MUST exceed the 50 MB upload ceiling. clamd's 25 MB default does
      # not error on a larger stream — it truncates and reports the prefix clean, i.e. it
      # fails OPEN on exactly the large files most worth scanning (R-32).
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    # R-32 sizes this as a real service, not a sidecar: the signature database is held in
    # memory. Starving it makes clamd die under load, which fails ingestion closed —
    # correct, but a needless outage.
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  minio-data:
  redis-data:
  pgdata:
  clamav-data:
