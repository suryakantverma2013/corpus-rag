# Corpus dev infrastructure (T-005).
#
# Default service: Redis (arq broker) only. The developer reuses existing local
# services for the rest — a local pgvector-enabled Postgres (dedicated `corpus`
# database) and a MinIO already on :9000/:9001. Both are available here behind
# profiles for anyone who lacks a local one:
#   docker compose --profile minio    up -d   # + MinIO object storage
#   docker compose --profile postgres up -d   # + pgvector Postgres
#   docker compose --profile clamav   up -d   # + ClamAV malware scanner (T-207, R-32)
#   docker compose --profile ocr      up -d   # + Tesseract OCR sidecar (T-217, R-88)
#
# Usage (from repo root):
#   docker compose -f deployment/docker-compose.yml up -d                    # redis only
#   docker compose -f deployment/docker-compose.yml --profile minio up -d    # redis + minio
#   docker compose -f deployment/docker-compose.yml --profile clamav up -d   # redis + clamav
#   docker compose -f deployment/docker-compose.yml --profile ocr up -d --build  # redis + ocr
#   docker compose -f deployment/docker-compose.yml down
#
# Credentials here are DEV DEFAULTS and match backend/.env(.example). Override via
# the environment for anything shared.

services:
  # Optional: only for developers without an existing MinIO. Enable with
  # `--profile minio`.
  #
  # Ports are env-driven because the service this profile replaces is usually already
  # holding 9000/9001 — a foreign MinIO on the default ports is the exact situation that
  # makes someone enable this profile, and a hardcoded mapping then refuses to start.
  # Set MINIO_API_PORT/MINIO_CONSOLE_PORT (and MINIO_ENDPOINT in backend/.env to match)
  # to run alongside it; the defaults are unchanged for anyone with the ports free.
  minio:
    image: minio/minio
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: only for developers without a local pgvector instance.
  # Enable with `--profile postgres`. Schema + indexes are owned by Alembic (T-101);
  # this just creates the `corpus` database and enables the `vector` extension.
  postgres:
    image: pgvector/pgvector:pg18
    profiles: ["postgres"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-corpus}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      # PostgreSQL 18+ images want the volume at /var/lib/postgresql, NOT at .../data:
      # they keep the cluster in a major-version-specific subdirectory so `pg_upgrade --link`
      # works across one mount point. With the old path the entrypoint refuses to start and
      # the container restart-loops, explaining at length that it found "PostgreSQL data in
      # /var/lib/postgresql/data (unused mount/volume)". Found while building the production
      # stack (T-605); this profile had the same latent defect.
      - pgdata:/var/lib/postgresql
      - ./initdb/01-extension.sql:/docker-entrypoint-initdb.d/01-extension.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-corpus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Malware screening for the ingestion worker (T-207, ruling R-32 / spec §8.13).
  # Profile-gated like the other heavyweights: it wants ~2 GB of RAM for the signature
  # database, so a developer working on the API alone should not have to run it. With the
  # profile off, set SCANNER_BACKEND=structural — the in-process structural screens still
  # run (R-38(7)); there is no setting that disables screening entirely.
  #
  # First start is slow: freshclam downloads ~1 GB of signatures before clamd accepts
  # connections, hence the long start_period. The named volume keeps that download from
  # repeating on every restart.
  clamav:
    image: clamav/clamav:latest
    profiles: ["clamav"]
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
      # StreamMaxLength MUST exceed the 50 MB upload ceiling. clamd's 25 MB default does
      # not error on a larger stream — it truncates and reports the prefix clean, i.e. it
      # fails OPEN on exactly the large files most worth scanning (R-32).
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    # R-32 sizes this as a real service, not a sidecar: the signature database is held in
    # memory. Starving it makes clamd die under load, which fails ingestion closed —
    # correct, but a needless outage.
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # FR-ING-07 optical character recognition (T-217, ruling R-88 / spec §8.78).
  #
  # NFR-SEC-09 is why this is a container rather than a library call: recognition is the
  # first ingestion step that *renders* attacker-supplied content, so the image decoders and
  # the engine sit outside the worker, where a defect in them cannot reach its database
  # session or its object-storage credentials. The worker rasterises the page and sends a
  # PNG; nothing leaves the deployment.
  #
  # Profile-gated like ClamAV, and additionally off by default in the application
  # (PARSER_OCR_ENABLED=false, R-88(12)) — with the profile down and the flag false, PDF
  # ingestion behaves exactly as it did before Rev 0.55.
  #
  # Built rather than pulled: the image pins its base by digest and Tesseract by Debian
  # version, because R-88(1) makes byte-reproducible recognition a *correctness* property —
  # text that differs between two passes over one page leaves `embedding_fingerprint` reuse
  # permanently empty and turns every re-ingestion into a silent full re-embed.
  ocr:
    build: ./ocr
    profiles: ["ocr"]
    ports:
      # Published because the application runs natively on the dev box (§8.67): the worker
      # reaches the sidecar on localhost, not over a compose network.
      - "${OCR_PORT:-8884}:8884"
    volumes:
      # The extension point for extra language packs: drop a `.traineddata` in and set
      # OCR_LANGUAGES. A named volume seeds itself from the image ONLY while it is empty, so
      # after rebuilding with a different pinned pack you must `docker volume rm` this one —
      # otherwise the deployment quietly keeps recognising with the old data. The sidecar's
      # `GET /health` reports a digest per pack so that state is visible rather than assumed.
      - ocr-tessdata:/usr/share/tesseract-ocr/5/tessdata
    # Recognition is CPU- and memory-bounded per page, not a resident database like clamd's
    # signatures; this is headroom for a large page at 300 DPI, not a working set.
    mem_limit: 1g
    healthcheck:
      # The image has Python and deliberately not curl. Probe over the loopback address
      # rather than a name, on R-81(5)'s lesson: the stock ClamAV probe pinged `localhost`,
      # resolved ::1, and reported a healthy daemon unhealthy forever.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8884/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  minio-data:
  redis-data:
  pgdata:
  clamav-data:
  ocr-tessdata:
