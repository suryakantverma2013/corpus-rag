# clamd configuration for Corpus ingestion screening (T-207, ruling R-32 / spec §8.13).
#
# Mounted read-only at /etc/clamav/clamd.conf by the `clamav` service in
# docker-compose.yml. This REPLACES the image's default conf, so it has to be complete —
# omitting the local socket, for instance, breaks the image's own `clamdcheck.sh`
# healthcheck even though the application only ever talks TCP.
#
# Keep StreamMaxLength in step with CLAMAV_MAX_STREAM_BYTES in backend/.env. The
# application refuses to boot if that value drops below UPLOAD_MAX_FILE_BYTES, but nothing
# on the application side can inspect *this* file.

DatabaseDirectory /var/lib/clamav
User clamav
Foreground yes
LogTime yes

# TCP for the in-tree async INSTREAM client (app/services/clamav.py) — R-32 chose that
# over the sync, unmaintained clamd/pyclamd PyPI packages.
TCPSocket 3310
TCPAddr 0.0.0.0

# The image's clamdcheck.sh healthcheck expects the local socket.
LocalSocket /tmp/clamd.sock

# ---------------------------------------------------------------------------------
# THE SETTING THIS FILE EXISTS FOR.
#
# Corpus accepts uploads up to 300 MB (FR-ERR-01, R-93). clamd's default StreamMaxLength is
# 25 MB, and exceeding it is not an error: clamd truncates the stream and reports the
# truncated prefix as clean. That is a silent bypass for precisely the large files most
# worth scanning, so R-32 makes raising this above 300 MB normative. MaxFileSize matters just
# as much and for the same reason: clamd SKIPS a file larger than it and reports it clean.
#
# 100 MB leaves headroom if the upload ceiling is ever raised, and the client refuses to
# stream anything larger rather than risk the truncation.
# ---------------------------------------------------------------------------------
StreamMaxLength 320M

# Scan-depth limits, bounding work on hostile archives. The parser-side decompression
# caps (R-31(3), PARSER_DOCX_*) are the other half of that defence.
MaxScanSize 640M
MaxFileSize 320M
MaxRecursion 16
MaxFiles 10000

# Worth having for a document corpus: a .docx carrying OLE2 macros is a disguised DOCM,
# which is exactly what the structural screen looks for. Belt and braces on the same
# threat, from an engine that sees inside the container.
AlertOLE2Macros yes

# Deliberately NOT enabled: AlertEncryptedDoc / AlertEncryptedArchive.
#
# A password-protected PDF is an ordinary thing for a user to upload by mistake, and the
# parser already reports it as ENCRYPTED_DOCUMENT (R-34) — a message that tells them what
# to do. Letting ClamAV flag it first would relabel that as "malware detected", which is
# both wrong and unactionable. The screen runs before the parser, so whichever of the two
# fires first owns the message the user sees.
